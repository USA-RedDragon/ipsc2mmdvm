# Sample configuration for Config.
# Logging level for the application. One of debug, info, warn, or error
log-level: "info"
# Configuration for Prometheus metrics
metrics:
  # Whether to enable Prometheus metrics endpoint
  enabled: false
  # Address to serve Prometheus metrics on
  address: ":9100"
# Configuration for MMDVM clients (multiple DMR masters)
# mmdvm: []  # list of objects:
# mmdvm:
#   - name: ""
# Configuration for the IPSC server
ipsc:
  # Interface to listen for IPSC packets on
  # interface: ""
  # Port to listen for IPSC packets on
  # port: 0
  # IP address to listen for IPSC packets on
  ip: "10.10.250.1"
  # Subnet mask for the virtual network interface created for IPSC packets
  subnet-mask: 24
  # Authentication configuration for the IPSC server
  auth:
    # Whether to require authentication for IPSC clients
    enabled: false
    # Authentication key for IPSC clients. Required if auth is enabled
    # key: ""
